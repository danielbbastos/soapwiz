name: Tests

on:
  pull_request:
    paths:
      - '**/*.swift'
      - 'SoapWiz.xcodeproj/**'
      - '.github/workflows/tests.yml'
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The project gates iOS 26 features with `#available(iOS 26, *)`, which the
      # compiler can only parse against an SDK that knows about iOS 26. Runner
      # images ship several Xcodes and rotate versions, so select the newest
      # installed rather than pinning a path that goes stale. The glob covers both
      # naming styles seen in the wild (Xcode_26.1.app, Xcode26_1.app).
      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version

      # `test` needs a concrete bootable simulator — `generic/platform=iOS Simulator`
      # only works for `build`. Ask xcodebuild which destinations are eligible for
      # this scheme and toolchain: `simctl` also lists runtimes the selected Xcode
      # cannot target, which is how a pinned Xcode 26.1 ended up trying to use an
      # iOS 26.2 device and failing.
      - name: Choose a simulator
        id: sim
        run: |
          xcodebuild -project SoapWiz.xcodeproj -scheme SoapWiz -showdestinations \
            2>/dev/null | tee destinations.txt
          SIMS=$(grep 'platform:iOS Simulator' destinations.txt | grep -v placeholder)
          # Prefer an iPhone for determinism, but any eligible simulator will do —
          # these are unit tests, not device-specific UI tests.
          UDID=$(printf '%s\n' "$SIMS" | grep 'name:iPhone' \
            | grep -oE 'id:[0-9A-Fa-f-]{36}' | head -1 | cut -d: -f2)
          if [ -z "$UDID" ]; then
            UDID=$(printf '%s\n' "$SIMS" | grep -oE 'id:[0-9A-Fa-f-]{36}' | head -1 | cut -d: -f2)
          fi
          if [ -z "$UDID" ]; then
            echo "No eligible iOS Simulator destination for the SoapWiz scheme" >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      # `SoapWizUITests` is a target in project.pbxproj with no sources on disk.
      # pipefail matters: without it a failing xcodebuild would be masked if this
      # command is ever piped through a formatter.
      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SoapWiz.xcodeproj \
            -scheme SoapWiz \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skip-testing:SoapWizUITests \
            -resultBundlePath TestResults.xcresult \
            -quiet

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
