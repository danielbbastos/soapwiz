name: Tests

on:
  pull_request:
    paths:
      - '**/*.swift'
      - 'SoapWiz.xcodeproj/**'
      - '.github/workflows/tests.yml'
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The project gates iOS 26 features with `#available(iOS 26, *)`, which the
      # compiler can only parse against an SDK that knows about iOS 26. The runner
      # image ships several Xcodes and the default is not guaranteed to be the
      # newest, so pin it explicitly.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.app
          xcodebuild -version

      # `test` needs a concrete bootable simulator — `generic/platform=iOS Simulator`
      # only works for `build`. Rather than hardcode a device name that breaks when
      # GitHub changes the image, pick the newest available iPhone at runtime.
      - name: Choose a simulator
        id: sim
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[]
                      | select(.key | test("iOS"))
                      | .value[] | select(.name | startswith("iPhone"))]
                     | last.udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No available iPhone simulator found on this runner" >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      # `SoapWizUITests` is a target in project.pbxproj with no sources on disk.
      # pipefail matters: without it a failing xcodebuild would be masked if this
      # command is ever piped through a formatter.
      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SoapWiz.xcodeproj \
            -scheme SoapWiz \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skip-testing:SoapWizUITests \
            -resultBundlePath TestResults.xcresult \
            -quiet

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
